<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-style: normal;
        font-size: 1.125rem;
      }

      .drop-area {
        width: 50%;
        height: 150px;
        font-size: 1.125rem;

        margin: 20px;
        border: 2px solid #ccc;
        border-radius: 10px;
        box-shadow: 3px 2px 10px rgba(0, 0, 0, 0.5) inset;
        padding: 15px;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .drop-area.dragover {
        border-color: #000;
      }
    </style>
    <script>
      // Notes: 
      // - Filenames cannot be blank.
      // - Hashes can be blank if you're comparing whole files.
      // - must_have and cannot_have are string arrays.
      window.file_comparison_options = {
        test_file_source: "test_reference",
        files_or_hashes: "files",
        filenames: ["MIT_LICENSE.txt"],
        hashes: {
          "MIT_LICENSE.txt": "e771153422a9693fe7780d9fe84d2284dff16aefe00b9005b5a8c87ad4599405"
        },
        must_have: [],
        cannot_have: [],
        credit_options: {
          blank_lines: .8,
          case: .7,
          spaces: .9,
          low_cutoff: 0.5,
          high_cutoff: 0.9,
          participation_points: 0.2,
        },
      };
    </script>
  </head>

  <body>
    <div id="prompt-area"></div>
    <button id="file-drop-area" class="drop-area">
      Drop files here or click to select files
    </button>
    <div id="info-area"></div>
    <div id="output-area"></div>
    <script src="simple_file_comparison.js" data-options="options.json"></script>
  </body>
</html>
